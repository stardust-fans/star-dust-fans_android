name: Read Windows broker update state

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-windows-brokers:
    runs-on: [self-hosted, Windows, need-tool-node, need-time-5m]
    timeout-minutes: 5
    steps:
      - name: Read both broker roots and scheduler state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $revision = 'f929b6164fe55c0c510485f9869816f482ee8560'
          $shortRevision = $revision.Substring(0, 12)
          $targets = @(
            @{ Root = 'D:\GitEdge\runner-broker'; BrokerTask = 'GitEdgeRunnerBroker'; Suffix = '1' },
            @{ Root = 'D:\GitEdge\runner-broker-2'; BrokerTask = 'GitEdgeRunnerBroker-2'; Suffix = '2' }
          )

          function Get-MessageCategory([string]$Text) {
            if ($Text -match '(?i)(dubious ownership|safe\.directory)') { return 'git_trust' }
            if ($Text -match '(?i)(cannot find module|module not found|err_module_not_found)') { return 'module_missing' }
            if ($Text -match '(?i)(already running|another instance|singleton|lock.*already exists)') { return 'singleton_lock' }
            if ($Text -match '(?i)(eaddrinuse|address.*already in use|port.*in use)') { return 'port_conflict' }
            if ($Text -match '(?i)(process.*crash|application error|faulting application)') { return 'process_crash' }
            if ($Text -match '(?i)(start-process.*failed|failed to spawn|could not start process)') { return 'process_launch_failed' }
            if ($Text -match '(?i)(exited with code [1-9]|non-zero exit code|exit code [1-9])') { return 'process_exit_nonzero' }
            if ($Text -match '(?i)(active\.lock|lease|lock.*held|did not become idle)') { return 'lease_lock_error' }
            if ($Text -match '(?i)(enoent|no such file or directory)') { return 'enoent' }
            if ($Text -match '(?i)(access is denied|permission denied|unauthorizedaccess)') { return 'permission' }
            if ($Text -match '(?i)(service did not start|service.*not running)') { return 'service_start_failed' }
            if ([string]::IsNullOrWhiteSpace($Text)) { return 'none' }
            return 'other'
          }

          function Get-Sid([string]$Principal) {
            if ($Principal -match '^S-\d-') { return [System.Security.Principal.SecurityIdentifier]::new($Principal) }
            return ([System.Security.Principal.NTAccount]::new($Principal)).Translate([System.Security.Principal.SecurityIdentifier])
          }

          function Get-SafeArgv([string]$Arguments) {
            $tokens = @([regex]::Matches($Arguments, '"([^"]*)"|(\S+)') | ForEach-Object {
              if ($_.Groups[1].Success) { $_.Groups[1].Value } else { $_.Groups[2].Value }
            })
            $safe = @()
            $revealNextPath = $false
            $redactRemainder = $false
            $redactNextArg = $false
            foreach ($token in $tokens) {
              if ($redactRemainder) { $safe += '<redacted>'; continue }
              if ($redactNextArg) { $safe += '<redacted>'; $redactNextArg = $false; $revealNextPath = $false; continue }
              if ($token -match '(?i)(token|secret|password|authorization|cookie|credential|https?://)') {
                $safe += '<redacted>'
                $redactNextArg = $token -notmatch '=' -and $token -match '^(?:--?)(?:token|secret|password|authorization|cookie|credential)$'
                $revealNextPath = $false
                continue
              }
              if ($token -in @('-Command', '-EncodedCommand')) { $safe += $token; $redactRemainder = $true; continue }
              if ($revealNextPath) {
                $safe += if ([IO.Path]::IsPathRooted($token)) { $token } else { '<redacted>' }
                $revealNextPath = $false
                continue
              }
              if ($token -in @('-File', '--state-dir', '--config', '-WorkingDirectory', '-RedirectStandardOutput', '-RedirectStandardError')) {
                $safe += $token
                $revealNextPath = $true
              } elseif ($token -in @('-NoLogo', '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-WindowStyle', 'Hidden', 'serve')) {
                $safe += $token
              } elseif ([IO.Path]::IsPathRooted($token)) {
                $safe += $token
              } elseif ($token -match '^(?:--[a-z-]+|-{1,2}[A-Za-z][A-Za-z0-9-]*)$') {
                $safe += $token
              } else {
                $safe += '<redacted>'
              }
            }
            return ,$safe
          }

          function Get-NormalizedPath([string]$Value) {
            try { return [IO.Path]::GetFullPath($Value).TrimEnd('\').Replace('/', '\') } catch { return '' }
          }

          function Get-LogFlags([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return [ordered]@{ present = $false } }
            $counts = [ordered]@{ git_trust = 0; module_missing = 0; singleton_lock = 0; port_conflict = 0; process_crash = 0; process_launch_failed = 0; process_exit_nonzero = 0; lease_lock_error = 0; enoent = 0; permission = 0; service_start_failed = 0; unclassified = 0 }
            $lines = @(Get-Content -LiteralPath $Path -Tail 200 -ErrorAction SilentlyContinue)
            foreach ($line in $lines) {
              $category = Get-MessageCategory ([string]$line)
              if ($counts.Contains($category)) { $counts[$category]++ }
              elseif (-not [string]::IsNullOrWhiteSpace([string]$line)) { $counts.unclassified++ }
            }
            return [ordered]@{ present = $true; nonEmpty = ($lines.Count -gt 0); lineCount = $lines.Count; categoryCounts = $counts }
          }

          $reports = @()
          foreach ($target in $targets) {
            $helperName = 'GitEdgeBrokerUpdate-' + $shortRevision + '-' + $target.Suffix
            $report = [ordered]@{
              root = $target.Root
              expectedRevision = $revision
              receipt = $null
              git = $null
              brokerTask = $null
              updaterTask = $null
              brokerProcesses = $null
              brokerRuntimeProcess = $null
              launcherScript = $null
              serviceLogs = $null
            }
            $receiptPath = Join-Path $target.Root 'work\broker-update-receipt.json'
            if (Test-Path -LiteralPath $receiptPath -PathType Leaf) {
              try {
                $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json -ErrorAction Stop
                $report.receipt = [ordered]@{
                  exists = $true
                  status = $receipt.status
                  revision = $receipt.revision
                  previous = $receipt.previous
                  completedAt = $receipt.completedAt
                  messageCategory = if ($receipt.message -is [string]) { Get-MessageCategory $receipt.message } else { 'none' }
                }
              } catch { $report.receipt = [ordered]@{ exists = $true; parseError = 'invalid_json' } }
            } else { $report.receipt = [ordered]@{ exists = $false } }

            $headOutput = @(& git -c "safe.directory=$($target.Root)" -C $target.Root rev-parse HEAD 2>$null)
            $headExitCode = $LASTEXITCODE
            $statusOutput = @(& git -c "safe.directory=$($target.Root)" -C $target.Root status --porcelain --untracked-files=no 2>$null)
            $statusExitCode = $LASTEXITCODE
            $report.git = [ordered]@{
              headExitCode = $headExitCode
              head = if ($headExitCode -eq 0) { ($headOutput | Out-String).Trim() } else { $null }
              statusExitCode = $statusExitCode
              trackedChangedFileCount = if ($statusExitCode -eq 0) { @($statusOutput).Count } else { $null }
            }

            try {
              $broker = Get-ScheduledTask -TaskName $target.BrokerTask -ErrorAction Stop
              $brokerInfo = Get-ScheduledTaskInfo -TaskName $target.BrokerTask -ErrorAction Stop
              $currentSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
              $brokerSid = Get-Sid ([string]$broker.Principal.UserId)
              $actions = @($broker.Actions | ForEach-Object {
                [ordered]@{ executePath = $_.Execute; argv = Get-SafeArgv ([string]$_.Arguments) }
              })
              $report.brokerTask = [ordered]@{
                state = $broker.State.ToString()
                lastTaskResult = $brokerInfo.LastTaskResult
                lastRunTime = $brokerInfo.LastRunTime
                currentUserMatchesPrincipal = ($currentSid -eq $brokerSid)
                actions = $actions
              }
              $expectedLauncher = if ($target.Suffix -eq '1') { 'D:\GitEdge\start-broker.ps1' } else { 'D:\GitEdge\start-broker-2.ps1' }
              $launcherArgument = [regex]::Match([string]$broker.Actions[0].Arguments, '(?i)-File\s+"?([^"\s]+\.ps1)')
              $launcherPath = if ($launcherArgument.Success) { $launcherArgument.Groups[1].Value } else { $null }
              if ($launcherPath -and [string]::Equals($launcherPath, $expectedLauncher, [StringComparison]::OrdinalIgnoreCase) -and (Test-Path -LiteralPath $launcherPath -PathType Leaf)) {
                $launcherText = Get-Content -LiteralPath $launcherPath -Raw -ErrorAction Stop
                $report.launcherScript = [ordered]@{
                  path = $launcherPath
                  fileExists = $true
                  startProcessCalls = [regex]::Matches($launcherText, '(?i)\bStart-Process\b').Count
                  containsBrokerEntrypoint = $launcherText -match '(?i)runner-broker\.mjs'
                  redirectsStdout = $launcherText -match '(?i)RedirectStandardOutput|StandardOutPath'
                  redirectsStderr = $launcherText -match '(?i)RedirectStandardError|StandardErrorPath'
                  waitsForChild = $launcherText -match '(?i)WaitForExit|Wait-Process|HasExited'
                  usesWaitSwitch = $launcherText -match '(?i)\s-Wait(?:\s|$)'
                  usesPassThru = $launcherText -match '(?i)\s-PassThru(?:\s|$)'
                  checksChildExitCode = $launcherText -match '(?i)ExitCode|\$LASTEXITCODE|service did not start'
                  envFileSourceCategory = if ($launcherText -match '(?i)\.env(?:\b|\.)|dotenv') { 'env_file' } elseif ($launcherText -match '(?i)\$env:') { 'process_environment' } else { 'none_detected' }
                  envFileBasenames = @([regex]::Matches($launcherText, '(?i)[A-Za-z0-9._-]+\.env(?:\.[A-Za-z0-9._-]+)?') | ForEach-Object { [IO.Path]::GetFileName($_.Value) } | Select-Object -Unique)
                  logBasenames = @([regex]::Matches($launcherText, '(?i)[A-Za-z0-9._-]+\.(?:out|err)\.log') | ForEach-Object { $_.Value } | Select-Object -Unique)
                  nodeExecutableLiteralPath = if ($launcherText -match '(?i)([A-Z]:\\[^''"\s;]*node\.exe)') { $Matches[1] } else { $null }
                }
              } else {
                $report.launcherScript = [ordered]@{ path = $expectedLauncher; fileExists = $false; actionMatchesExpected = [string]::Equals($launcherPath, $expectedLauncher, [StringComparison]::OrdinalIgnoreCase) }
              }
            } catch { $report.brokerTask = [ordered]@{ available = $false; category = 'task_query_failed' } }

            try {
              $helper = Get-ScheduledTask -TaskName $helperName -ErrorAction Stop
              $helperInfo = Get-ScheduledTaskInfo -TaskName $helperName -ErrorAction Stop
              $report.updaterTask = [ordered]@{
                state = $helper.State.ToString()
                lastTaskResult = $helperInfo.LastTaskResult
                lastRunTime = $helperInfo.LastRunTime
                actions = @($helper.Actions | ForEach-Object { [ordered]@{ executePath = $_.Execute; argv = Get-SafeArgv ([string]$_.Arguments) } })
              }
            } catch { $report.updaterTask = [ordered]@{ available = $false; category = 'task_query_failed' } }

            try {
              $categoryCounts = [ordered]@{ broker_runtime = 0; node_other = 0; powershell = 0; git = 0; other = 0 }
              $rootPattern = [regex]::Escape($target.Root.TrimEnd('\')) + '(?:\\|"|\s|$)'
              $processes = @(Get-CimInstance Win32_Process -ErrorAction Stop | Where-Object {
                ([string]$_.ExecutablePath).Equals($target.Root, [StringComparison]::OrdinalIgnoreCase) -or
                ([string]$_.ExecutablePath).StartsWith(($target.Root.TrimEnd('\') + '\'), [StringComparison]::OrdinalIgnoreCase) -or
                ([string]$_.CommandLine) -match $rootPattern
              })
              $counts = [ordered]@{}
              foreach ($process in $processes) {
                $name = [IO.Path]::GetFileName([string]$process.ExecutablePath)
                if (-not $name) { $name = [string]$process.Name }
                if (-not $counts.Contains($name)) { $counts[$name] = 0 }
                $counts[$name]++
                $category = if ([string]$process.CommandLine -match '(?i)runner-broker\.mjs') { 'broker_runtime' }
                  elseif ($name -match '(?i)^node(?:\.exe)?$') { 'node_other' }
                  elseif ($name -match '(?i)^pwsh(?:\.exe)?$|^powershell(?:\.exe)?$') { 'powershell' }
                  elseif ($name -match '(?i)^git(?:\.exe)?$') { 'git' }
                  else { 'other' }
                $categoryCounts[$category]++
              }
              $report.brokerProcesses = [ordered]@{ count = $processes.Count; imageCounts = $counts; commandCategoryCounts = $categoryCounts }
              $runtimeProcesses = @($processes | Where-Object { [string]$_.CommandLine -match '(?i)runner-broker\.mjs' -and ([string]$_.Name -match '(?i)^node(?:\.exe)?$') })
              $expectedBrokerScript = Join-Path $target.Root 'scripts\runner-broker.mjs'
              $expectedNode = 'D:\GitHubActions\tools\node-v24.22.0-win-x64\node.exe'
              $expectedRuntime = if ($target.Suffix -eq '1') {
                [ordered]@{ processId = 97244; startedAtUtc = '2026-10-22T18:07:22.2329430Z' }
              } else {
                [ordered]@{ processId = 98104; startedAtUtc = '2026-10-22T18:07:33.1104330Z' }
              }
              $report.brokerRuntimeProcess = @($runtimeProcesses | ForEach-Object {
                $argv = Get-SafeArgv ([string]$_.CommandLine)
                $scriptIndexes = @(for ($index = 1; $index -lt $argv.Count; $index++) {
                  if ([string]::Equals([string]$argv[$index], $expectedBrokerScript, [StringComparison]::OrdinalIgnoreCase)) { $index }
                })
                $startedAt = try { ([datetime]$_.CreationDate).ToUniversalTime().ToString('o') } catch { $null }
                $startedAtUtc = try { [datetimeoffset]::Parse([string]$startedAt).UtcDateTime } catch { $null }
                $receiptTime = try { [datetimeoffset]::Parse([string]$receipt.completedAt).UtcDateTime } catch { $null }
                $startRelation = if ($null -eq $receiptTime -or $null -eq $startedAtUtc) { 'unknown' } elseif ($startedAtUtc -lt $receiptTime) { 'before_update_receipt' } else { 'at_or_after_update_receipt' }
                $expectedTime = [datetimeoffset]::Parse([string]$expectedRuntime.startedAtUtc).UtcDateTime
                $exactIdentity = $_.ProcessId -eq $expectedRuntime.processId -and $startedAtUtc -eq $expectedTime
                $stateIndexes = @(for ($index = 0; $index -lt $argv.Count; $index++) {
                  if ([string]::Equals([string]$argv[$index], '--state-dir', [StringComparison]::OrdinalIgnoreCase)) { $index }
                })
                $unsafeEntryPoint = @($argv | Where-Object { $_ -match '^(?i)(?:-e|--eval|-p|--print|-r|--require|--import|--loader|--experimental-loader)(?:=|$)' }).Count -gt 0
                $scriptIndex = if ($scriptIndexes.Count -eq 1) { [int]$scriptIndexes[0] } else { -1 }
                $stateIndex = if ($stateIndexes.Count -eq 1) { [int]$stateIndexes[0] } else { -1 }
                $nodePathMatches = (Get-NormalizedPath ([string]$_.ExecutablePath)) -eq (Get-NormalizedPath $expectedNode) -and
                  (Get-NormalizedPath ([string]$argv[0])) -eq (Get-NormalizedPath $expectedNode)
                $validArgv =
                  $nodePathMatches -and
                  -not $unsafeEntryPoint -and
                  $scriptIndex -gt 0 -and
                  $scriptIndex + 1 -lt $argv.Count -and
                  [string]::Equals([string]$argv[$scriptIndex + 1], 'serve', [StringComparison]::OrdinalIgnoreCase) -and
                  $stateIndex -gt $scriptIndex + 1 -and
                  $stateIndex + 1 -lt $argv.Count
                $stateArgument = if ($validArgv) { [string]$argv[$stateIndex + 1] } else { $null }
                $stateSegments = if ($stateArgument) { @($stateArgument -split '[\\/]') } else { @() }
                $safeStatePath = $stateArgument -and [IO.Path]::IsPathRooted($stateArgument) -and
                  $stateArgument.StartsWith('D:\GitEdge\', [StringComparison]::OrdinalIgnoreCase) -and
                  $stateSegments -notcontains '..'
                $stateDirectory = if ($validArgv -and $exactIdentity -and $safeStatePath) { [IO.Path]::GetFullPath($stateArgument) } else { $null }
                [ordered]@{
                  processId = $_.ProcessId
                  startedAtUtc = $startedAt
                  startRelationToUpdateReceipt = $startRelation
                  image = $_.Name
                  argvTokenCount = $argv.Count
                  nodeExecutableMatchesExpected = $nodePathMatches
                  brokerScriptMatchCount = $scriptIndexes.Count
                  serveFollowsBrokerScript = ($scriptIndex -gt 0 -and $scriptIndex + 1 -lt $argv.Count -and [string]::Equals([string]$argv[$scriptIndex + 1], 'serve', [StringComparison]::OrdinalIgnoreCase))
                  stateDirectoryFlagCount = $stateIndexes.Count
                  unsafeEntryPoint = $unsafeEntryPoint
                  executablePath = $_.ExecutablePath
                  expectedScriptPath = $expectedBrokerScript
                  scriptPathMatchesExpected = ($scriptIndexes.Count -eq 1)
                  hasServeArgument = $validArgv
                  stateDirectoryIdentityMatchesKnownProcess = $exactIdentity -and $validArgv
                  stateDirectory = $stateDirectory
                  stateDirectoryUniqueAcrossRoots = $false
                }
              })
            } catch { $report.brokerProcesses = [ordered]@{ available = $false; category = 'process_query_failed' } }

            $logDir = Join-Path $target.Root 'work\logs'
            $opsDir = Join-Path $target.Root 'work\ops'
            $report.serviceLogs = [ordered]@{
              stdout = Get-LogFlags (Join-Path $logDir 'runner-broker.out.log')
              stderr = Get-LogFlags (Join-Path $logDir 'runner-broker.err.log')
            }
            $report.updaterLogs = [ordered]@{
              stdout = Get-LogFlags (Join-Path $opsDir ('broker-update-' + $shortRevision + '-logged-' + $target.Suffix + '.out.log'))
              stderr = Get-LogFlags (Join-Path $opsDir ('broker-update-' + $shortRevision + '-logged-' + $target.Suffix + '.err.log'))
            }
            $reports += [pscustomobject]$report
          }
          $runtimeStateDirectories = @($reports | ForEach-Object { @($_.brokerRuntimeProcess) | Where-Object { $_.stateDirectory } | ForEach-Object { [string]$_.stateDirectory } })
          $stateDirectoriesAreDistinct = $runtimeStateDirectories.Count -eq 2 -and $runtimeStateDirectories[0] -ne $runtimeStateDirectories[1]
          foreach ($report in $reports) {
            foreach ($runtime in @($report.brokerRuntimeProcess)) {
              if ($runtime.stateDirectory) { $runtime['stateDirectoryUniqueAcrossRoots'] = $stateDirectoriesAreDistinct }
            }
          }
          $reports | ConvertTo-Json -Depth 8
