plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stardust.fans'
    compileSdk 34
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.stardust.fans'
        minSdk 23
        targetSdk 34
        versionCode 6
        versionName '1.3.0'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets', '../../../packages/site-contract']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

}
