name: Mobile verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - run: npm test
      - name: Test Android navigation policy
        run: bash test/android/run-navigation-policy.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0"'
      - name: Build Android debug APK
        working-directory: apps/android
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  apple:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build iPhone and iPad app
        run: >-
          xcodebuild -project apps/apple/StarDust.xcodeproj -scheme StarDust
          -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO build
      - name: Run Apple model tests
        run: >-
          xcodebuild -project apps/apple/StarDust.xcodeproj -scheme StarDust
          -destination 'platform=iOS Simulator,name=iPhone 16' -derivedDataPath build/apple
          CODE_SIGNING_ALLOWED=NO test
