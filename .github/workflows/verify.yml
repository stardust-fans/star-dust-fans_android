name: Mobile verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Read pinned website routes
        run: |
          commit=$(node -p "require('./packages/site-contract/site.json').webSource.commit")
          git init "$RUNNER_TEMP/site-source"
          git -C "$RUNNER_TEMP/site-source" fetch --depth=1 https://github.com/stardust-fans/star-dust-fans.git "$commit"
          git -C "$RUNNER_TEMP/site-source" checkout --detach FETCH_HEAD
          echo "WEB_REFERENCE=$RUNNER_TEMP/site-source" >> "$GITHUB_ENV"
      - run: npm test
      - name: Test Android navigation policy
        run: bash test/android/run-navigation-policy.sh

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0"'
      - name: Build Android debug APK
        working-directory: apps/android
        run: bash ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  apple:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build iPhone and iPad app
        run: >-
          xcodebuild -project apps/apple/StarDust.xcodeproj -scheme StarDust
          -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/apple CODE_SIGNING_ALLOWED=NO build
      - name: Run Apple model tests
        run: >-
          xcodebuild -project apps/apple/StarDust.xcodeproj -scheme StarDust
          -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.5'
          -destination 'platform=iOS Simulator,name=iPad (A16),OS=18.5'
          -derivedDataPath build/apple
          CODE_SIGNING_ALLOWED=NO test
      - name: Package simulator app
        run: ditto -c -k --keepParent build/apple/Build/Products/Debug-iphonesimulator/StarDust.app build/apple/StarDust-simulator.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apple-simulator
          path: build/apple/StarDust-simulator.zip
          if-no-files-found: error

  apple-device-unsigned:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build generic iOS device app without signing
        run: >-
          xcodebuild -project apps/apple/StarDust.xcodeproj -scheme StarDust
          -sdk iphoneos -configuration Release -destination 'generic/platform=iOS'
          -derivedDataPath build/apple-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Verify and package unsigned device app
        run: |
          app=build/apple-device/Build/Products/Release-iphoneos/StarDust.app
          test -d "$app"
          test ! -e "$app/embedded.mobileprovision"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$RUNNER_TEMP/StarDust-unsigned-ios-device.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apple-device-unsigned
          path: ${{ runner.temp }}/StarDust-unsigned-ios-device.zip
          if-no-files-found: error
