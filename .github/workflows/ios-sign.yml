name: iOS signing

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  sign-ipa:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Archive unsigned iOS device app
        run: |
          mkdir -p build/apple-device
          xcodebuild -project apps/apple/StarDust.xcodeproj -scheme StarDust \
            -sdk iphoneos -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/apple-device/unsigned.xcarchive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive

      - name: Package unsigned app and source metadata
        id: source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive=build/apple-device/unsigned.xcarchive
          app="$archive/Products/Applications/StarDust.app"
          test -d "$archive"
          test -d "$app"
          test ! -e "$app/embedded.mobileprovision"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" = 'top.stardustinfinity.mobile'
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          stage="$RUNNER_TEMP/ios-sign-input"
          mkdir -p "$stage"
          ditto -c -k --norsrc --keepParent "$archive" "$stage/unsigned.xcarchive.zip"
          listing=$(unzip -Z1 "$stage/unsigned.xcarchive.zip")
          grep -q '^unsigned\.xcarchive/Info\.plist$' <<< "$listing"
          grep -q '^unsigned\.xcarchive/Products/Applications/StarDust\.app/Info\.plist$' <<< "$listing"
          ! grep -qv '^unsigned\.xcarchive/' <<< "$listing"
          APP_VERSION="$version" node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          const source = {
            platform: 'ios', architecture: 'arm64', bundle_id: 'top.stardustinfinity.mobile',
            version: process.env.APP_VERSION, source_sha: process.env.SOURCE_SHA,
          };
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(source.version) || !/^[0-9a-f]{40}$/.test(source.source_sha)) {
            throw new Error('Invalid app source metadata.');
          }
          await writeFile(`${process.env.RUNNER_TEMP}/ios-sign-input/source.json`, `${JSON.stringify(source)}\n`);
          await writeFile(process.env.GITHUB_OUTPUT, `version=${source.version}\n`, { flag: 'a' });
          NODE

      - id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-ios-archive
          path: ${{ runner.temp }}/ios-sign-input/*
          if-no-files-found: error
          compression-level: 0

      - name: Submit source archive to GitEdge
        id: signing
        env:
          ARTIFACT_ID: ${{ steps.unsigned.outputs.artifact-id }}
          APP_VERSION: ${{ steps.source.outputs.version }}
          GITEDGE_SIGNING_TOKEN: ${{ secrets.GITEDGE_SIGNING_TOKEN }}
          GITEDGE_SIGNING_PROFILE: ${{ vars.GITEDGE_SIGNING_PROFILE }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/ios-sign-api.mjs

      - name: Wait for and download verified signing output
        id: result
        env:
          ARTIFACT_ID: ${{ steps.unsigned.outputs.artifact-id }}
          GITEDGE_SIGNING_TOKEN: ${{ secrets.GITEDGE_SIGNING_TOKEN }}
          GITEDGE_SIGNING_PROFILE: ${{ vars.GITEDGE_SIGNING_PROFILE }}
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ steps.signing.outputs.request_id }}
          SOURCE_DIGEST: ${{ steps.signing.outputs.source_digest }}
          SOURCE_SIZE: ${{ steps.signing.outputs.source_size }}
        run: node .github/scripts/ios-sign-api.mjs retrieve

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify signed iOS IPA
        env:
          STATUS_PATH: ${{ steps.result.outputs.status_path }}
          SOURCE_ARCHIVE: ${{ steps.result.outputs.source_archive }}
          SIGNED_ARCHIVE: ${{ steps.result.outputs.signed_archive }}
          RECIPE_SHA: ${{ steps.result.outputs.recipe_sha }}
          TEAM_ID: ${{ steps.result.outputs.team_id }}
        run: |
          set -euo pipefail
          python3 test/verify-signed-ipa.py \
            --status "$STATUS_PATH" \
            --signed-zip "$SIGNED_ARCHIVE" \
            --source-artifact "$SOURCE_ARCHIVE" \
            --recipe-sha "$RECIPE_SHA" \
            --team-id "$TEAM_ID" \
            --bundle-id top.stardustinfinity.mobile \
            --receipt-output "$RUNNER_TEMP/verification-receipt.json" \
            --quiet
          cat "$RUNNER_TEMP/verification-receipt.json" >> "$GITHUB_STEP_SUMMARY"
