name: GitEdge Windows runtime verification controller

on:
  workflow_dispatch:

permissions:
  contents: none

jobs:
  maintain-runner-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Commit fixed workflow and dispatch Windows verification
        env:
          GITEDGE_SIGNING_TOKEN: ${{ secrets.GITEDGE_SIGNING_TOKEN }}
        run: |
          node <<'NODE'
          const repositoryId = '13814fa3-8580-4b5a-803e-a6b1206007ed';
          const apiOrigin = 'https://gitedge.voidcarve.com';
          const token = process.env.GITEDGE_SIGNING_TOKEN;
          if (!token) throw new Error('The GitEdge API token is unavailable.');
          const files = [{"path":".github/workflows/windows-broker-verify.yml","dispatch":true,"payload":""},{"path":".github/workflows/linux-arm64-host-readback.yml","dispatch":true,"payload":""}];
          const dispatchedPaths = [".github/workflows/windows-broker-verify.yml",".github/workflows/linux-arm64-host-readback.yml"];
          const { gunzipSync } = require('node:zlib');
          const safeErrorCodes = new Set(['bad_request', 'conflict', 'feature_disabled', 'file_too_large', 'forbidden', 'insufficient_scope', 'internal_error', 'not_found', 'payload_too_large', 'protected_branch', 'refs_changed', 'repository_archived', 'run_limit', 'unauthorized']);
          async function api(label, route, options = {}) {
            let response;
            try {
              response = await fetch(apiOrigin + route, { ...options, headers: { Authorization: 'Bearer ' + token, ...(options.headers ?? {}) }, redirect: 'error', signal: AbortSignal.timeout(30_000) });
            } catch {
              throw new Error(label + ' failed (network or timeout).');
            }
            const result = await response.json().catch(() => null);
            if (!response.ok) {
              const code = safeErrorCodes.has(result?.error?.code) ? ' ' + result.error.code : '';
              throw new Error(label + ' failed (HTTP ' + response.status + code + ').');
            }
            if (!result || !Object.hasOwn(result, 'data')) throw new Error(label + ' returned an invalid response.');
            return result.data;
          }
          (async () => {
            try {
              const repository = '/api/git/repositories/' + repositoryId;
              const branch = await api('Read main revision', repository + '/files?ref=main');
              if (typeof branch.oid !== 'string' || !/^[a-f0-9]{40}$/.test(branch.oid)) throw new Error('GitEdge returned an invalid main revision.');
              const currentFiles = await Promise.all(files.map((file) => api('Read existing fixed workflow', repository + '/file?ref=main&path=' + encodeURIComponent(file.path))));
              if (currentFiles.some((current, index) => current.path !== files[index].path || typeof current.content !== 'string')) throw new Error('GitEdge returned an invalid workflow file.');
              const payloads = files.map((file) => gunzipSync(Buffer.from(file.payload, 'hex')));
              let expectedOid = branch.oid;
              if (currentFiles.some((current, index) => current.content !== payloads[index].toString('utf8'))) {
                const form = new FormData();
                const changes = files.map((file, index) => ({ op: 'put', path: file.path, part: 'file' + index }));
                form.set('manifest', JSON.stringify({ branch: 'main', expectedOid: branch.oid, message: 'Verify Windows runtime and inspect Linux broker [skip ci]', changes }));
                files.forEach((file, index) => form.set('file' + index, new Blob([payloads[index]], { type: 'text/yaml' }), file.path.split('/').at(-1)));
                const committed = await api('Commit runner maintenance workflows', repository + '/commit', { method: 'POST', body: form });
                if (committed.branch !== 'main' || typeof committed.oid !== 'string' || !/^[a-f0-9]{40}$/.test(committed.oid)) throw new Error('GitEdge returned an invalid commit result.');
                expectedOid = committed.oid;
              }
              const actions = '/api/actions/repositories/' + repositoryId + '/runs';
              const runs = [];
              for (const workflowPath of dispatchedPaths) {
                const queued = await api('Dispatch ' + workflowPath, actions, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ workflowPath, ref: 'main', expectedOid }) });
                if (typeof queued.id !== 'string' || !/^[A-Za-z0-9._-]{1,128}$/.test(queued.id)) throw new Error('GitEdge returned an invalid workflow run ID.');
                runs.push({ workflowPath, runId: queued.id });
                console.log('Queued ' + workflowPath + ': ' + queued.id);
              }
              console.log(JSON.stringify({ repositoryId, commitOid: expectedOid, runs }));
            } catch (error) {
              const permittedLabel = /^(Read main revision|Read existing fixed workflow|Commit runner maintenance workflows|Dispatch \.github\/workflows\/(windows-broker-verify|linux-arm64-host-readback)\.yml) (failed \(HTTP \d{3}(?: [a-z_]+)?\)\.|failed \(network or timeout\)\.|returned an invalid response\.)$/;
              const message = error instanceof Error && permittedLabel.test(error.message) ? error.message : 'Maintenance controller failed.';
              console.error(message);
              process.exitCode = 1;
            }
          })().catch(() => { console.error('Maintenance controller failed.'); process.exitCode = 1; });
          NODE