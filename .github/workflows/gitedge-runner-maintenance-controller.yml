name: GitEdge Windows runtime verification controller
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  cleanup-completed-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clean completed owned updaters and maintenance workflows
        env:
          GITEDGE_SIGNING_TOKEN: ${{ secrets.GITEDGE_SIGNING_TOKEN }}
        run: |
          node <<'NODE'
          
          const origin = 'https://gitedge.voidcarve.com';
          const repositoryId = '13814fa3-8580-4b5a-803e-a6b1206007ed';
          const repository = '/api/git/repositories/' + repositoryId;
          const token = process.env.GITEDGE_SIGNING_TOKEN;
          const workflowPath = ".github/workflows/windows-broker-final-cleanup.yml";
          const removePaths = [".github/workflows/linux-arm64-host-readback.yml",".github/workflows/macos-broker-update.yml",".github/workflows/macos-broker-verify-cleanup.yml",".github/workflows/macos-signing-diagnostics.yml",".github/workflows/windows-broker-diagnostics.yml",".github/workflows/windows-broker-readback.yml",".github/workflows/windows-broker-stage.yml",".github/workflows/windows-broker-state-diagnostics.yml",".github/workflows/windows-broker-update.yml",".github/workflows/windows-broker-verify-cleanup.yml",".github/workflows/windows-broker-verify.yml",".github/workflows/windows-native-signing-log-probe.yml",".github/workflows/runner-label-routing-verification.yml",".github/workflows/windows-broker-final-cleanup.yml"];
          const bytes = require('node:zlib').gunzipSync(Buffer.from('', 'hex'));
          async function api(route, options={}) {
            const response = await fetch(origin + route, {...options, headers:{Authorization:'Bearer '+token,...options.headers}, redirect:'error', signal:AbortSignal.timeout(30000)});
            const result = await response.json().catch(()=>null);
            if (!response.ok || !result || !Object.hasOwn(result,'data')) throw new Error('Fixed cleanup API failed.');
            return result.data;
          }
          async function commit(changes, message, fileBytes) {
            const head = await api(repository+'/files?ref=main');
            if (!/^[a-f0-9]{40}$/.test(head.oid)) throw new Error('Invalid branch revision.');
            const form = new FormData();
            form.set('manifest',JSON.stringify({branch:'main',expectedOid:head.oid,message,changes}));
            if (fileBytes) form.set('cleanup',new Blob([fileBytes],{type:'text/yaml'}),'windows-broker-final-cleanup.yml');
            const result = await api(repository+'/commit',{method:'POST',body:form});
            if (result.branch!=='main'||!/^[a-f0-9]{40}$/.test(result.oid)) throw new Error('Invalid commit result.');
            return result.oid;
          }
          (async()=>{
            if (!token) throw new Error('Missing scoped token.');
            const expectedOid = await commit([{op:'put',path:workflowPath,part:'cleanup'}],'Prepare completed updater cleanup',bytes);
            const run = await api('/api/actions/repositories/'+repositoryId+'/runs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workflowPath,ref:'main',expectedOid})});
            if (!/^[a-f0-9-]{36}$/.test(run.id)) throw new Error('Invalid run identity.');
            console.log('Cleanup run: '+run.id);
            let succeeded=false;
            for (let i=0;i<60;i++) {
              const current = await api('/api/actions/runs/'+run.id);
              if (current.status==='completed') {
                if (current.conclusion!=='success') throw new Error('Owned updater cleanup failed.');
                succeeded=true; break;
              }
              await new Promise(r=>setTimeout(r,10000));
            }
            if (!succeeded) throw new Error('Cleanup still pending; no workflows removed.');
            const oid=await commit(removePaths.map(path=>({op:'delete',path})),'Remove completed signing maintenance workflows');
            console.log(JSON.stringify({cleanupRun:run.id,conclusion:'success',removedWorkflows:removePaths.length,commit:oid}));
          })().catch(()=>{console.error('Fixed completed-updater cleanup failed.');process.exitCode=1;});
          
          NODE
